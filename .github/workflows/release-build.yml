name: Release Build

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: Signing environment
        required: false
        type: choice
        options: [ release ]
        default: release

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build Signed Release APK & AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ github.event.inputs.environment || 'release' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. Add it to the 'release' GitHub environment."
            exit 1
          fi
          mkdir -p app/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/keystore/rona-release.jks
          sha256sum app/keystore/rona-release.jks | awk '{print "keystore-sha256=" $1}' >> "$GITHUB_OUTPUT"

      - name: Write signing properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p app/keystore
          printf 'storeFile=rona-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
            > app/keystore/signing.properties

      - name: Verify signing files are not tracked in git
        run: |
          if git ls-files --error-unmatch app/keystore >/dev/null 2>&1; then
            echo "::error::Signing credentials must never be committed. app/keystore/ is tracked in git."
            exit 1
          fi
          echo "✓ Signing keystore and properties are untracked (gitignored)."

      - name: Build signed release APK & AAB
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify INTERNET permission absent (offline-only policy)
        run: |
          if grep -r "android.permission.INTERNET" app/build/intermediates/merged_manifests/release; then
            echo "::error::SECURITY VIOLATION: android.permission.INTERNET detected in release manifest."
            exit 1
          fi
          echo "✓ No INTERNET permission in release manifest."

      - name: Upload signed release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rona-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rona-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@e7a8f85e1c67a31e6ed99a94b41bd0b71bbee6b8 # v2.0.9
        with:
          generate_release_notes: true
          make_latest: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
