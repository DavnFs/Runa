name: Personal Beta Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Beta version name, for example 0.1.0-dev.1"
        required: true
        type: string
      version_code:
        description: "Strictly increasing positive integer"
        required: true
        type: string
      release_notes:
        description: "Short private beta notes"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: personal-beta-release
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'dependabot[bot]'
    name: Build and publish personal beta
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: personal-beta

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.1

      - name: Build, verify, and publish private beta
        shell: bash
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
          GIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          BETA_KEYSTORE_BASE64: ${{ secrets.ANDROID_BETA_KEYSTORE_BASE64 }}
          BETA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_BETA_KEYSTORE_PASSWORD }}
          BETA_KEY_ALIAS: ${{ secrets.ANDROID_BETA_KEY_ALIAS }}
          BETA_KEY_PASSWORD: ${{ secrets.ANDROID_BETA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          version_name_pattern='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          version_code_pattern='^[1-9][0-9]*$'
          if [[ ! "$VERSION_NAME" =~ $version_name_pattern ]]; then
            echo "::error::Invalid version_name. Use a value such as 0.1.0-dev.1."
            exit 1
          fi
          if [[ ! "$VERSION_CODE" =~ $version_code_pattern ]] || (( VERSION_CODE > 2147483647 )); then
            echo "::error::version_code must be a positive 32-bit integer."
            exit 1
          fi
          if gh release view "v$VERSION_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION_NAME already exists."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION_NAME" >/dev/null 2>&1; then
            echo "::error::Git tag v$VERSION_NAME already exists."
            exit 1
          fi

          latest_code=0
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            body="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq '.body')"
            code="$(printf '%s\n' "$body" | sed -n 's/^<!-- rona-version-code: *\([0-9][0-9]*\) *-->$/\1/p' | head -1 | tr -d '\r')"
            if [[ "$code" =~ ^[0-9]+$ ]] && (( code > latest_code )); then
              latest_code="$code"
            fi
          done < <(
            gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
              --json tagName,name,isPrerelease,isDraft \
              --jq '.[] | select(.isPrerelease == true and .isDraft == false and (.name | startswith("Runa Personal Beta "))) | .tagName'
          )
          if (( VERSION_CODE <= latest_code )); then
            echo "::error::version_code $VERSION_CODE must be greater than latest beta versionCode $latest_code."
            exit 1
          fi

          if [[ -z "$BETA_KEYSTORE_BASE64" || -z "$BETA_KEYSTORE_PASSWORD" || -z "$BETA_KEY_ALIAS" || -z "$BETA_KEY_PASSWORD" ]]; then
            echo "::error::All personal-beta signing secrets must be configured."
            exit 1
          fi

          signing_dir="$RUNNER_TEMP/rona-beta-signing"
          output_dir="$RUNNER_TEMP/rona-beta-output"
          cleanup() {
            rm -rf -- "$signing_dir" "$output_dir"
          }
          trap cleanup EXIT INT TERM

          mkdir -m 700 -p "$signing_dir" "$output_dir"
          keystore="$signing_dir/beta.keystore"
          signing_properties="$signing_dir/signing.properties"
          printf '%s' "$BETA_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$keystore" "$BETA_KEYSTORE_PASSWORD" "$BETA_KEY_ALIAS" "$BETA_KEY_PASSWORD" > "$signing_properties"
          chmod 600 "$signing_properties"

          ./gradlew testDebugUnitTest --no-daemon
          ./gradlew lintDebug --no-daemon
          ./gradlew assembleRelease --no-daemon \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE" \
            -PsigningPropertiesFile="$signing_properties"

          apk='app/build/outputs/apk/release/app-release.apk'
          [[ -f "$apk" ]] || { echo "::error::Signed release APK was not produced."; exit 1; }
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          [[ -x "$apksigner_path" ]] || { echo "::error::apksigner was not found."; exit 1; }
          "$apksigner_path" verify --verbose --print-certs "$apk"

          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libsqlcipher.so' >/dev/null
          manifest="$(find app/build/intermediates/merged_manifests/release -type f -name AndroidManifest.xml -print -quit)"
          [[ -f "$manifest" ]] || { echo "::error::Merged release manifest was not found."; exit 1; }
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo "::error::INTERNET permission found in release manifest."
            exit 1
          fi

          release_apk="$output_dir/runa-${VERSION_NAME}.apk"
          cp "$apk" "$release_apk"
          sha256sum "$release_apk" > "$release_apk.sha256"
          printf '<!-- rona-version-code: %s -->\n\n%s\n' \
            "$VERSION_CODE" "$RELEASE_NOTES_INPUT" > "$output_dir/RELEASE_NOTES.txt"
          printf 'versionName: %s\nversionCode: %s\napplicationId: id.rona.app\ncommit: %s\n' \
            "$VERSION_NAME" "$VERSION_CODE" "$GIT_SHA" > "$output_dir/BUILD_INFO.txt"

          if find "$output_dir" -type f \( \
            -name '*.jks' -o -name '*.keystore' -o -name '*.pem' -o -name '*.key' -o \
            -name '*.db' -o -name '*.sqlite' -o -name '*.sqlcipher' -o -name '*.rona' -o -name '*.ronabackup' -o -name '*.env' \
          \) -print -quit | grep -q .; then
            echo "::error::Signing, database, backup, or secret file found in release output."
            exit 1
          fi

          gh release create "v$VERSION_NAME" \
            "$release_apk" \
            "$release_apk.sha256" \
            "$output_dir/RELEASE_NOTES.txt" \
            "$output_dir/BUILD_INFO.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Runa Personal Beta v$VERSION_NAME" \
            --notes-file "$output_dir/RELEASE_NOTES.txt" \
            --prerelease
