name: CI & Build

# push ke main / pull request / manual -> verifikasi lalu unggah APK debug
# yang bisa diunduh dan dipasang ke HP.
#
# APK diunggah di setiap run. Kalau artifact mulai menumpuk di storage,
# turunkan retention-days atau batasi ke event tertentu.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Satu pemanggilan Gradle, bukan empat. Tiap pemanggilan terpisah
      # membayar ulang start-up JVM + konfigurasi Gradle.
      - name: Lint, unit test, build debug + R8 release
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease

      - name: Report debug APK size and checksum
        run: |
          set -euo pipefail

          apk="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "::error::Debug APK was not produced."
            exit 1
          fi

          echo "APK: $apk"
          ls -lh "$apk"
          sha256sum "$apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: runa-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      # Hanya saat gagal — untuk mendiagnosis, bukan untuk distribusi.
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7
