name: Runa CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Lint & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android lint
        run: ./gradlew lintDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Assemble release verification build
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate merged manifests
        id: manifests
        shell: bash
        run: |
          set -euo pipefail

          DEBUG_MANIFEST="$(find app/build/intermediates/merged_manifests \
            -type f \
            -path "*debug*" \
            -name "AndroidManifest.xml" \
            -print -quit)"

          RELEASE_MANIFEST="$(find app/build/intermediates/merged_manifests \
            -type f \
            -path "*release*" \
            -name "AndroidManifest.xml" \
            -print -quit)"

          test -n "$DEBUG_MANIFEST"
          test -n "$RELEASE_MANIFEST"

          echo "debug_manifest=$DEBUG_MANIFEST" >> "$GITHUB_OUTPUT"
          echo "release_manifest=$RELEASE_MANIFEST" >> "$GITHUB_OUTPUT"

      - name: Verify local-only privacy policy
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking debug merged manifest:"
          cat "${{ steps.manifests.outputs.debug_manifest }}"

          echo "Checking release merged manifest:"
          cat "${{ steps.manifests.outputs.release_manifest }}"

          if grep -H "android.permission.INTERNET" \
            "${{ steps.manifests.outputs.debug_manifest }}" \
            "${{ steps.manifests.outputs.release_manifest }}"; then
            echo "::error::SECURITY VIOLATION: INTERNET permission detected."
            exit 1
          fi

          echo "Privacy policy passed: no INTERNET permission."

      - name: Audit failure reports for sensitive files
        id: audit
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "app/build/reports" ]; then
            echo "No reports directory exists; no artifact will be uploaded."
            exit 0
          fi

          SENSITIVE_FILE="$(find app/build/reports -type f \( \
            -name "*.db" -o \
            -name "*.db-wal" -o \
            -name "*.db-shm" -o \
            -name "*.sqlite" -o \
            -name "*.sqlcipher" -o \
            -name "*.rona" -o \
            -name "*.ronabackup" -o \
            -name "*.runa-backup" -o \
            -name "*.env" -o \
            -name "*.jks" -o \
            -name "*.keystore" -o \
            -name "*.pem" -o \
            -name "*.key" \
          \) -print -quit)"

          if [ -n "$SENSITIVE_FILE" ]; then
            echo "::error::Sensitive file found in CI report directory: $SENSITIVE_FILE"
            exit 1
          fi

          echo "Failure reports are safe to upload."

      - name: Upload sanitized test results
        if: ${{ failure() && steps.audit.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload sanitized lint report
        if: ${{ failure() && steps.audit.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7
