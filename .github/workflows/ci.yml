name: Rona CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Minimal permissions (least privilege principle)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Gradle Wrapper Integrity
        uses: gradle/actions/wrapper-validation@ccb80843a99230550478051752b57ccf72eb37f3 # v4.2.1

      - name: Set up JDK 17
        uses: actions/setup-java@8df103950263308ed45e779d5e8c3f9824fec647 # v4.3.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@743d5f308a0029b4b04f7c191a62d08a54ca5a6e # v4.2.1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble Debug and Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Verify Privacy Architecture — No INTERNET Permission in Merged Manifests
        run: |
          echo "Verifying debug and release merged manifests for zero internet permission..."
          if grep -R "android.permission.INTERNET" app/build/intermediates/merged_manifests/debug app/build/intermediates/merged_manifests/release; then
            echo "::error::SECURITY VIOLATION: android.permission.INTERNET detected in merged manifests! Local-only build policy violated."
            exit 1
          fi
          echo "✓ Security check passed: No INTERNET permission found in debug or release manifests."

      - name: Verify reports contain no sensitive or database files
        if: failure()
        run: |
          ! find app/build/reports -type f \( \
            -name "*.db" -o \
            -name "*.sqlite" -o \
            -name "*.sqlcipher" -o \
            -name "*.rona" -o \
            -name "*.ronabackup" -o \
            -name "*.env" -o \
            -name "*.jks" -o \
            -name "*.keystore" \
          \) | grep .

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Upload Lint Report
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7
